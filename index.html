<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0f13">
<title>Depth Maker</title>
<link rel="manifest" href="3-manifest.webmanifest">
<link rel="icon" href="4-icon192.png">
<link rel="apple-touch-icon" href="4-icon192.png">
<style>
  :root{--bg:#0e0f13;--card:#171922;--line:#262a37;--tx:#eef0f6;--mut:#8b91a5;--ac:#7c8cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:26px;margin:6px 0 2px}
  .sub{color:var(--mut);margin:0 0 18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button,.btn,select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font:inherit;cursor:pointer;transition:background .2s,transform .15s,border-color .2s;outline:none}
  button:hover,.btn:hover{border-color:var(--ac)}
  button:active,.btn:active{transform:scale(.97)}
  button.primary,.btn.primary{background:var(--ac);border-color:var(--ac);color:#0b0c12;font-weight:600}
  button:disabled{opacity:.4;cursor:default}
  input[type=file]{display:none}
  .stage{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.stage{grid-template-columns:1fr}}
  .pane{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
  .pane canvas{display:block;width:100%;height:auto;background:#000}
  .tag{position:absolute;left:10px;top:10px;background:#000a;padding:3px 10px;border-radius:99px;font-size:13px;z-index:1}
  .empty{aspect-ratio:16/9;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}
  .fx{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .fx button.on{background:var(--ac);border-color:var(--ac);color:#0b0c12;font-weight:600}
  .opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:14px;min-height:36px}
  .opts label{display:flex;gap:8px;align-items:center}
  input[type=range]{accent-color:var(--ac)}
  #status{color:var(--mut);font-size:14px;margin:10px 0;min-height:20px}
  .bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0;display:none}
  .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
  .hint{color:var(--mut);font-size:13px}
  .player{display:flex;gap:12px;align-items:center;margin:12px 0}
  .player input{flex:1}
  .player span{color:var(--mut);font-size:13px;min-width:92px;text-align:right}
</style>
</head>
<body>
<main>
  <h1>Depth Maker</h1>
  <p class="sub">Turn any video into a depth map. Runs on your device. Nothing is uploaded. Works offline after the first load.</p>

  <div class="row">
    <label class="btn primary" for="file">Upload a video</label>
    <input id="file" type="file" accept="video/*">
    <button id="cam">Live camera</button>
    <button id="stop" disabled>Stop</button>
    <select id="quality" title="Quality">
      <option value="0">Fast</option>
      <option value="1" selected>Balanced</option>
      <option value="2">Best (bigger model, 100 MB first time)</option>
    </select>
  </div>

  <div class="bar" id="bar"><i id="barfill"></i></div>
  <div id="status">Starting...</div>

  <div class="stage">
    <div class="pane"><span class="tag">Original</span><div class="empty" id="empty1">Pick a video or turn on the camera</div><canvas id="orig" hidden></canvas></div>
    <div class="pane"><span class="tag" id="fxtag">Turbo</span><div class="empty" id="empty2">The result shows here</div><canvas id="out" hidden></canvas></div>
  </div>

  <div class="player" id="player" hidden>
    <button id="play">Pause</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="time">0:00</span>
  </div>

  <div class="fx" id="fx"></div>
  <div class="opts" id="opts"></div>

  <div class="row" style="margin-top:16px">
    <button id="dlpng" disabled>Download image</button>
    <button id="dlvid" disabled>Download video</button>
    <span class="hint" id="vidhint"></span>
  </div>
</main>
<script type="module" src="1-app.js"></script>
</body>
</html>
